name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Build target
        type: choice
        default: both
        options: [both, arm64, x86_64]
      arm_runner:
        description: GitHub runner image for Apple Silicon
        type: choice
        default: macos-15
        options: [macos-15, macos-26]

permissions:
  contents: read

jobs:
  build:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && inputs.arm_runner || 'macos-15-intel' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'both' && '["arm64","x86_64"]' || format('["{0}"]', inputs.architecture)) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Test desktop workflows
        run: python tools/test_desktop.py
      - name: Build and verify archive
        env:
          APP_ARCH: ${{ matrix.arch }}
        run: |
          python tools/build_desktop.py
          unpacked=$(mktemp -d)
          ditto -x -k "dist/2GIS-Niche-Search-macOS-$APP_ARCH.zip" "$unpacked"
          app="$unpacked/2GIS Niche Search.app"
          executable="$app/Contents/MacOS/2GIS Niche Search"
          lipo "$executable" -verify_arch "$APP_ARCH"
          codesign --verify --deep --strict "$app"
          "$executable" > "$unpacked/startup.log" 2>&1 &
          app_pid=$!
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat "$unpacked/startup.log"
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" || true
      - uses: actions/upload-artifact@v7
        with:
          path: dist/2GIS-Niche-Search-macOS-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error
